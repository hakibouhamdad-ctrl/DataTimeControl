name: Decompress ZIP Project

on:
  push:
    branches: [ "main", "master", "principal" ]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          shopt -s nocaseglob
          found=0
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extraction de $file..."
              unzip -o "$file" -d .
              rm -f "$file"
              found=1
            fi
          done
          if [ $found -eq 0 ]; then
            echo "Aucun fichier ZIP trouvé à la racine."
            exit 1
          fi

      - name: Commit and push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git diff-index --quiet HEAD || git commit -m "Décompression automatique du projet ZIP"
          git push
          
